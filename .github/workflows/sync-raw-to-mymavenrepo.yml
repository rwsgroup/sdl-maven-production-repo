name: Sync raw files to mymavenrepo

# Sync raw maven-layout files to https://mymavenrepo.com/repo/WBK602nHXl923AOY0Axk/
on:
  push:
    branches:
      - '**'
  schedule:
    # weekly at 00:00 UTC on Sunday
    - cron: '0 0 * * 0'

concurrency:
  group: sync-mymavenrepo
  cancel-in-progress: true

jobs:
  sync-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build artifacts if pom.xml present (optional)
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml found — running mvn package (skip tests)"
            mvn -B package -DskipTests
          else
            echo "No pom.xml found — skipping build"
          fi

      - name: Upload tracked repo files to mymavenrepo
        env:
          BASE_URL: "https://mymavenrepo.com/repo/WBK602nHXl923AOY0Axk"
          MYMAVEN_USER: ${{ secrets.MYMAVEN_USERNAME }}
          MYMAVEN_PASSWORD: ${{ secrets.MYMAVEN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Using base URL: $BASE_URL"

          if [ -z "${MYMAVEN_USER:-}" ] || [ -z "${MYMAVEN_PASSWORD:-}" ]; then
            echo "GitHub secrets MYMAVEN_USERNAME or MYMAVEN_PASSWORD are not configured."
            exit 1
          fi

          # Collect tracked Maven repository files
          files=$(git ls-files 'maven/**' 'repository/**' || true)

          # If none found, upload built artifacts from target/
          if [ -z "$files" ]; then
            echo "No tracked repository files found. Looking in target/..."

            files=$(find target -type f \( \
              -name '*.jar' -o \
              -name '*.pom' -o \
              -name '*.war' -o \
              -name '*.zip' \
            \) || true)
          fi

          if [ -z "$files" ]; then
            echo "No files to upload."
            exit 0
          fi

          echo "Uploading files..."

          echo "$files" | while IFS= read -r f; do
            [ -z "$f" ] && continue

            rel="${f#./}"
            dest="${BASE_URL%/}/$rel"

            echo "Uploading: $rel"
            echo "Destination: $dest"

            curl \
              --fail-with-body \
              --retry 3 \
              --retry-delay 5 \
              -u "$MYMAVEN_USER:$MYMAVEN_PASSWORD" \
              -X PUT \
              --upload-file "$rel" \
              "$dest" \
              -H "Content-Type: application/octet-stream"

            echo "Uploaded: $rel"
          done

          echo "All uploads completed."