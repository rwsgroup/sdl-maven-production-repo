name: Sync changed artifacts to MyMavenRepo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload changed artifacts
        env:
          BASE_URL: https://mymavenrepo.com/repo/WBK602nHXl923AOY0Axk
          MYMAVEN_USER: ${{ secrets.MYMAVEN_USERNAME }}
          MYMAVEN_PASSWORD: ${{ secrets.MYMAVEN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MYMAVEN_USER:-}" ] || [ -z "${MYMAVEN_PASSWORD:-}" ]; then
            echo "Missing MYMAVEN_USERNAME or MYMAVEN_PASSWORD"
            exit 1
          fi

          echo "Finding changed files..."

          git diff --name-only HEAD~1 HEAD > changed.txt

          cat changed.txt

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # Skip deleted files
            [ ! -f "$file" ] && continue

            echo "Uploading $file"

            curl \
              --fail \
              --retry 3 \
              --retry-delay 5 \
              -u "$MYMAVEN_USER:$MYMAVEN_PASSWORD" \
              --upload-file "$file" \
              "${BASE_URL}/${file}"

          done < changed.txt

          echo "Done."