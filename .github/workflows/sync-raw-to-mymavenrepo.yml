- name: Upload artifacts to MyMavenRepo
  env:
    BASE_URL: https://mymavenrepo.com/repo/WBK602nHXl923AOY0Axk
    MYMAVEN_USER: ${{ secrets.MYMAVEN_USERNAME }}
    MYMAVEN_PASSWORD: ${{ secrets.MYMAVEN_PASSWORD }}
  run: |
    set -euo pipefail

    if [ -z "${MYMAVEN_USER:-}" ] || [ -z "${MYMAVEN_PASSWORD:-}" ]; then
      echo "Missing credentials."
      exit 1
    fi

    echo "Finding repository files..."

    find com -type f | sort > files.txt

    echo "Found $(wc -l < files.txt) files"

    cat files.txt

    while IFS= read -r file; do
      dest="${BASE_URL}/${file}"

      echo ""
      echo "Uploading $file"

      curl \
        --fail \
        --retry 3 \
        -u "$MYMAVEN_USER:$MYMAVEN_PASSWORD" \
        --upload-file "$file" \
        "$dest"

    done < files.txt

    echo "Upload complete."